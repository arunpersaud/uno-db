{% extends "base.html" %}
{% block title %}Log in – The UNO database{% endblock %}
{% block head %}<meta name="csrf-token" content="{{ csrf_token() }}">{% endblock %}
{% block content %}
<h1>Log in</h1>
<p>Log in with the passkey you set up with your invite link.</p>
<button type="button" data-passkey="login">Log in with a passkey</button>
<p class="error" role="alert" data-passkey-error hidden></p>
<p><small>No login yet? See <a href="{{ url_for('stats.contribute') }}">Add your
  own games</a>.</small></p>
{% endblock %}
