[project]
name = "unodb"
version = "0.1.0"
description = "UNO game statistics: players, sessions, games and scores"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23",
    "markdown-it-py>=4.2.0",
    "openskill>=6.2.0",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
